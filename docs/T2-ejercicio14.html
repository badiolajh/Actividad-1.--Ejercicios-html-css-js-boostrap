<!doctype html>
<html lang="es">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <script src="JS/ejercicio14.js"></script>
    </head>

    <body>
        <div class="contenedor">
            <h1>MAX, MIN Y MEDIA DE NUMEROS</h1>
            <p>Ingresa varios numeros</p>

            <div class="columna">
                <label>Numero</label>
                <input
                    type="text"
                    placeholder="Ej. 30,40,10,19"
                    id="num"
                    required
                />
            </div>
        </div>
        <div class="columna">
            <label>Mayor</label>
            <input type="number" id="mayor" readonly />
        </div>
        <div class="columna">
            <label>Menor</label>
            <input type="number" id="menor" readonly />
        </div>
        <div class="columna">
            <label>Promedio</label>
            <input type="number" id="promedio" readonly />
        </div>

        <div class="Boton">
            <button onclick="Calc()">Calcular</button>
        </div>
    </body>
</html>
